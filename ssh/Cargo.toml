[package]
name = "xorwyrm-ssh"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = { version = "0.10.3", features = ["thread_rng"] }
# No compression and no RSA: less code facing the internet. Every current client has an
# ed25519 or ecdsa key, and one that offers only RSA is still let in without a key.
russh = { version = "0.65.1", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
unicode-width = "0.2.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
